; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32F103C8]
platform = ststm32
board = genericSTM32F103C8
framework = arduino
build_flags =
    -D ENABLE_HWSERIAL1
    -D PIN_SERIAL1_TX=PA9
    -D PIN_SERIAL1_RX=PA10
monitor_speed = 115200

; SimpleFOC 2.4.0 已 vendored 到 lib/SimpleFOC（含 STM32 Arduino core 3.0.0 的
; enableTimerClock 签名适配补丁），版本由本项目自行管理，不再从注册表拉取。
; 如需升级：手动替换 lib/SimpleFOC/src 后重新应用补丁，勿改回 lib_deps。
; lib_deps = askuric/Simple FOC@^2.4.0
