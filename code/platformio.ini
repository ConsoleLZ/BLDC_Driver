; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; 沙箱环境下回收站不可用, 禁用安全删除避免 SAFE_DELETE_FAIL_CLOSED
safe_delete = off

[env:genericSTM32F103C8]
platform = ststm32
board = genericSTM32F103C8
framework = cmsis
debug_tool = stlink
upload_protocol = stlink
build_flags = -Isrc/STM32F10x_StdPeriph_Driver/inc -Isrc -Iinclude -D USE_STDPERIPH_DRIVER -D STM32F10X_MD
; 只编译用户代码; StdPeriph 库源码未被调用, 排除以免浪费 64KB Flash
build_src_filter = +<*> -<STM32F10x_StdPeriph_Driver/src>